{% extends "base.html" %}
{% block title %}Profil{% endblock title %}Profil

{% block css %}

    <style>
        
        body{
            background: radial-gradient(blue, white);

        }
        form.form button{
            margin-left: 43px;
            border-radius: 5px;
            background-color: black;
            color: white;
            width: 280px;
            height: 30px;
        }
        form.form{
            border: 3px;
            border-radius: 3px;
            width: 400px;
            height: 460px;
            margin-left: 300px;
            background: white;
            display: inline-block;
            border-radius: 10px;
        }
        h1{
            text-align: center;
            font-weight: bold;
        }
        p{
            text-align: center;

        }
        form.form label{
            margin-left: 43px;
        }
        form.form input{
            border-radius: 12px ;
            background-color: #FAFAFA ;
            display: block;
            margin-left: 43px;
            width: 280px;
            height: 40px;
            border: none;
            padding: 1rem 0.6rem;
        }
        p{
            text-align: center;
            text-decoration: none;

        }

            body{
                margin: 0;
                justify-content: center;
                font-family: Arial, sans-serif;
                transition: background-color 0.5s ease, color 0.5s ease;
            }
            body.light{
                background-color: #f8f9fa;
                color: #212529;
            }
            body.dark{
                background-color: #121212;
                color: #e4e6eb;
            }
            select{
                padding: 0.5rem;
                font-size: 1rem;
            } 
            .card{
                
                border-radius: 8px;
                transition:background-color 0.5s ease;
                
            }   
            body.dark .card{
                background-color: rgba(255,255,255,0.05);
            }
            
    </style>   

{% endblock css %}

{% block content %}


    
<div class="container">
    <div class="container">
        <div class="form">
            <form method="post" action="{% url 'inscription' %}" class="form">
                {% csrf_token %}
                <h1>PROFIL</h1>
                <label for="#username">Noms:</label>
                <input type="text" name="last_name"><br>
                <label for="#username">Prénoms:</label>
                <input type="text" name="first_name"><br>
                <label for="#username">Email:</label>
                <input type="email" name="email"><br>
                <label for="#password">Mot de passe:</label>
                <input type="password" name="password" required><br>
                <button type="submit">S'inscrire</button><br>
           
            </form>
           
        </div>
    </div>
</div>

{% endblock content %}


<i class="fa-brands fa-whatsapp"></i>

<i class="fa-solid fa-share"></i>
<i class="fa-regular fa-calendar-check"></i>
<i class="fa-solid fa-right-from-bracket"></i><i class="fa-solid fa-download"></i>
