{% extends "base.html" %}
{% block title %}
Ajouter un professeur
{% endblock title %}
{% block css %}
    <style>
        body{
            background: rgb(112, 200, 205);
        }
       
        h1{
            text-align: center;
            font-weight: bold;
            font-family: robotto;
        }
        .container{
            border: none;
            height: 500px;
        }
        .row{
            margin-bottom: 60px;
        }
        .container .row .col{
            margin-top: 10px;
        }
        .btn.btn-secondary{
            margin-left: 400px;
            width: 200px;
            border-radius: 8px;
            background: black;
            color: white;
        }
        label{
            font-weight: bold;
        }
        
            body{
                margin: 0;
                justify-content: center;
                font-family: Arial, sans-serif;
                transition: background-color 0.5s ease, color 0.5s ease;
            }
            body.light{
                background-color: #f8f9fa;
                color: #212529;
            }
            body.dark{
                background-color: #121212;
                color: #e4e6eb;
            }
            select{
                padding: 0.5rem;
                font-size: 1rem;
            } 
            .card{
                
                border-radius: 8px;
                transition:background-color 0.5s ease;
                
            }   
            body.dark .card{
                background-color: rgba(255,255,255,0.05);
            }
            
    </style>
{% endblock css %}
{% block content %}

    <div class="container">
        
            <form class="form" method="post" action="{% url 'professeur' %}" class="form">
                {% csrf_token %}
                <div class="row row-cols-2">
                    <div class="col">
                        <label for="#username">Noms:</label>
                        <input class="form-control sip" type="text" name="last_name"><br>
                    </div>
                    <div class="col">
                        <label for="#username">Prénoms:</label>
                        <input class="form-control sip" type="text" name="first_name"><br>
                    </div>
                    <div class="col">
                        <label for="#email">Email:</label>
                        <input class="form-control sip" type="email" name="email"><br>
                    </div>
                    <div class="col">
                        <label for="#username">Date de naissance:</label>
                        <input class="form-control sip" type="date" name="age"><br>
                </div>
                
                    <div class="col">
                        <label for="#password">Specialite:</label>
                        <input class="form-control sip" type="text" name="specialite"><br>
                    </div>
                    <div class="col">        
                        <label for="#username">Telephone:</label>
                        <input class="form-control sip" type="tel" name="numero" required><br>
                    </div>
                    <div class="col">
                        <label for="#password">Mot de passe:</label>
                        <input class="form-control sip" type="password" name="password"><br>
                    </div>    
                </div>
                <button class="btn btn-secondary" type="submit">Ajouter</button><br>
            </form>
            
        </div>

{% endblock content %}
