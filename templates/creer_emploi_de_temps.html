{% extends 'base.html' %}
{% load static %}

{% block title %}Créer Emploi du Temps{% endblock %}

{% block css %}
<style>
    .form-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    
    .form-title {
        color: #2c3e50;
        margin-bottom: 2rem;
        text-align: center;
        font-weight: 600;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #34495e;
    }
    
    .form-control {
        width: 100%;
        padding: 12px 16px;
        font-size: 1rem;
        border: 1px solid #dfe6e9;
        border-radius: 8px;
        transition: all 0.3s;
        background-color: #f8f9fa;
    }
    
    .form-control:focus {
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
        background-color: white;
    }
    
    select.form-control {
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 12px center;
        background-size: 1em;
    }
    
    .btn-submit {
        width: 100%;
        padding: 14px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .btn-submit:hover {
        background-color: #2980b9;
        transform: translateY(-2px);
    }
    
    /* Disposition responsive */
    @media (min-width: 768px) {
        .form-row {
            display: flex;
            gap: 1.5rem;
        }
        
        .form-row .form-group {
            flex: 1;
        }
    }
    body{
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="form-title">NOUVEL EMPLOI DU TEMPS</h1>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-row">
            <div class="form-group">
                <label for="filiere" class="form-label">Classe</label>
                <select class="form-control" name="filiere" id="filiere" required>
                    <option value="">-- Sélectionnez une classe --</option>
                    {% for filiere in filieres %}
                        <option value="{{ filiere.id }}">{{ filiere.nom }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="date_debut" class="form-label">Date de début</label>
                <input type="date" class="form-control" name="date_debut" id="date_debut" required>
            </div>
            
            <div class="form-group">
                <label for="date_fin" class="form-label">Date de fin</label>
                <input type="date" class="form-control" name="date_fin" id="date_fin" required>
            </div>
        </div>
        
        <div class="form-group" style="margin-top: 2.5rem;">
            <button type="submit" class="btn-submit">
                CRÉER L'EMPLOI DU TEMPS
            </button>
        </div>
    </form>
</div>

<script>
    // Amélioration de l'UX pour les dates
    document.addEventListener('DOMContentLoaded', function() {
        // Définir la date minimale à aujourd'hui
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('date_debut').min = today;
        document.getElementById('date_fin').min = today;
        
        // Synchroniser les dates
        document.getElementById('date_debut').addEventListener('change', function() {
            document.getElementById('date_fin').min = this.value;
        });
    });
</script>
{% endblock %}
