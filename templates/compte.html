{% extends "base.html" %}
{% block title %}compte{% endblock title %}
{% block css %}
    <style>
        body{
            background: skyblue;
        }
        form.form{
            
            width: 100%;
            height: 25%;
            margin-left: 20px;
            margin-top: 0px;
        }
        .container{
            
            margin-left: 100px;
            margin-top: 5px;
            width: 50%;
        }
        .sit {
            width: 600px;
            display: block;
            border-radius: 20px;
            border: none;
        }
        .ring{
            width: 200px;
            border: 4PX solid black;
            
            
        }
        label{
            font-weight: bold;
        }
        .nina{
            width: 100px;
            margin-left: 450px;
            background-color: rgb(0, 60, 255);
            color: white;
            border-radius: 10px;
            display: flex;
        }

        .tin{
            text-decoration: none;
            color: white;
            
        }
        .tina{
            text-decoration: none;
            color: blue;
            
        }
        .nin{
            font-weight: bold;
            margin-right: 200px;
        }
        
            body{
                margin: 0;
                justify-content: center;
                font-family: Arial, sans-serif;
                transition: background-color 0.5s ease, color 0.5s ease;
            }
            body.light{
                background-color: #f8f9fa;
                color: #212529;
            }
            body.dark{
                background-color: #121212;
                color: #e4e6eb;
            }
            select{
                padding: 0.5rem;
                font-size: 1rem;
            } 
            .card{
                
                border-radius: 8px;
                transition:background-color 0.5s ease;
                
            }   
            body.dark .card{
                background-color: rgba(255,255,255,0.05);
            }
            
    </style> 
{% endblock css %}
{% block content %}
    <div class="container">
        <form class="form" method="post">
            {% csrf_token %}
            {% if user.profile_image %}
                <img class="ring" src="{{user.profile_image.url}}"><br>
            {% else %}
                <img class="ring" src="/static/images/formateur.PNG"><br>
            {% endif %}
            <label for="">Noms:</label>
            <input class="sit" type="text" readonly name="last_name" value='{{user.last_name}}'><br>
            <label for="">Prenoms:</label>
            <input class="sit" type="text" readonly name="first_name" value='{{user.first_name}}'><br>
            <label for="">Adresse email:</label>
            <input class="sit" type="email" readonly name="email" value='{{user.email}}'><br>
            <label for="">Mot de passe:</label>
            <input class="sit" type="password" readonly name="password"><br>
            <button class="nina" type="submit"><a class="tin" href="/edit_compte/{{user.id}}" >Modifier</a></button>
           
        </form>
    </div>
{% endblock content %}

<div class="container profile profile-view" id="profile">
        <div class="row">
            <div class="col col-md-12 alert-col relative">
                <div class="alert alert-info alert-dismissible absolue center" role="alert"><button class="btn-close" type="button" aria-label="Close" data-bs-dismiss="alert"></button><span>Profile save with success</span></div>
            </div>
        </div>
        <form>
            <div class="row profile-row">
                <div class="col col-md-4 relative">
                    <div class="avatar">
                        <div class="avatar-bg center"></div>
                    </div><input class="form-control form-control" type="file" name="avatar-file">
                </div>
                <div class="col col-md-8">
                    <h1>Profile </h1>
                    <hr>
                    <div class="row">
                        <div class="col col-sm-12 col-md-6">
                            <div class="form-group mb-3">
                                <label class="form-label">Nom </label>
                                <input class="form-control" type="text" name="last_name">
                            </div>
                        </div>
                        <div class="col col-sm-12 col-md-6">
                            <div class="form-group mb-3">
                                <label class="form-label">Prenom</label>
                                <input class="form-control" type="text" name="first_name">
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Email </label>
                        <input class="form-control" type="email" autocomplete="off" required="" name="email">
                    </div>
                    <div class="row">
                        <div class="col col-sm-12 col-md-6">
                            <div class="form-group mb-3">
                                <label class="form-label">Password </label>
                                <input class="form-control" type="password" name="password" autocomplete="off" required="">
                            </div>
                        </div>
                        <div class="col col-sm-12 col-md-6">
                            <div class="form-group mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input class="form-control" type="password" name="confirmpass" autocomplete="off" required="">
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col col-md-12 content-right">
                            <button class="btn btn-primary form-btn" type="submit">SAVE </button>
                            <button class="btn btn-danger form-btn" type="reset">CANCEL </button>
                        </div>
                    </div>
                </div>
                </div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/Profile-Edit-Form-profile.js"></script>
