{% extends "base.html" %}
{% block title %}{% endblock title %}
{% block css %}
    <style>    
        .andy form{
            Width: 500Px;
            height: 260px;
            border-radius: 20px;
            background: whitesmoke;
            margin-top: 30px;
            padding: 20px;
            box-shadow: 10px 5px 5px gray;

        }
        .container .row .col{
            margin-top: 10px;
        }

        .lis{
            margin-top: 10px;
            font-weight: bold;
        }
        .btn.btn-primary{
            Width: 200Px;
            margin-top: 30px;
        
        }
        h1{
            text-align: center;
            font-weight: bold;
        }

        .blue{
            text-decoration: none;
            font-size: 24px;
            background-color: white;
            text-decoration: none;
        }
        span{
            margin-left: 800px;
        }
            body{
                margin: 0;
                justify-content: center;
                font-family: Arial, sans-serif;
                transition: background-color 0.5s ease, color 0.5s ease;
            }
            body.light{
                background-color: #f8f9fa;
                color: #212529;
            }
            body.dark{
                background-color: #121212;
                color: #e4e6eb;
            }
            select{
                padding: 0.5rem;
                font-size: 1rem;
            } 
            .card{
                
                border-radius: 8px;
                transition:background-color 0.5s ease;
                
            }   
            body.dark .card{
                background-color: rgba(255,255,255,0.05);
            }
            
    </style>
{% endblock css %}
{% block content %}
        <h1>Nouvelle specialite</h1>
        <span> <a class="blue" href="{% url 'liste_filiere' %}">Consulter</a> </span>
     <div class="container">
        <div class="andy d-flex justify-content-center">
            <form class="nick" method="post" >
                {% csrf_token %}
                <div class="col">
                    <label class="lis"  for="">Classe:</label>
                    <input class="form-control sim" type="text" name="departement">
                </div>
                <div class="col">
                    <label class="lis" for="">Specialite:</label>
                    <input class="form-control sim" type="text" name="nom">
                </div>
                <div class="d-flex justify-content-center">
                    <button class="btn btn-primary">Ajouter</button>
                </div>
            </form>
        </div>
    </div> 
    
{% endblock content %}
