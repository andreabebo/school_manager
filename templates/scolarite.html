{% extends "base.html" %}
{% block title %}{% endblock title %}
{% block css %}
    <style>
        body{
            background: rgb(196, 228, 255);

        }
       
        h1{
            text-align: center;
            font-weight: bold;
            font-family: robotto;

        }
        .container{
            border: none;
            height: 500px;
        }
        .row{
            margin-bottom: 60px;
        }
        .container .row .col{
            margin-top: 15px;
        }
        .btn.btn-secondary{
            width: 200px;
            border-radius: 8px;
            background: blue;
            color: white;
        }
        .sid{
            width: 300px;
        }
        .mit{
            display: flex;
        }
        
            body{
                margin: 0;
                justify-content: center;
                font-family: Arial, sans-serif;
                transition: background-color 0.5s ease, color 0.5s ease;
            }
            body.light{
                background-color: #f8f9fa;
                color: #212529;
            }
            body.dark{
                background-color: #121212;
                color: #e4e6eb;
            }
            select{
                padding: 0.5rem;
                font-size: 1rem;
            } 
            .card{
                
                border-radius: 8px;
                transition:background-color 0.5s ease;
                
            }   
            body.dark .card{
                background-color: rgba(255,255,255,0.05);
            }
            
    </style>

{% endblock css %}
{% block content %}
        <h1>SCOLARITE</h1>
    <div class="container">
         <form class="form" method="post">
            {% csrf_token %}
             
            <div class="row row-cols-2">
                   <div class="col">
                        <label for="filière choisie">Etudiant:</label> 
                        <select class="form-control student" name="student">
                            <option value="">----------
                                {% for student in students %}
                                    <option value="{{student.pk}}"> {{student.user.get_full_name}} </option>
                                {% endfor %}
                            </option>
                        </select>
                    </div>
                    <div class="col"> 
                        <label for="">Date de paiement:</label> 
                        <input class="form-control sip" type="date" name="date_paiement">
                    </div>
            
                   
                <div class="col">
                    <label for="">heure:</label> 
                    <input class="form-control sip" type="time" name="heure_paiement">
                </div>
                <div class="col">
                    <label for="">Tranche:</label> 
                    <input class="form-control sip" type="number" name="tranche" required>
                </div>
          
                <div class="col"> 
                    <label for="">Montant total:</label> 
                    <input class="form-control sip" type="decimal" name="montant_total">
                </div>
                <div class="col">
                    <label for="">Montant verse:</label> 
                    <input class="form-control sip" type="decimal" name="montant_verse">
                </div>
             </div>
            <div class="d-flex justify-content-center">
                <button class="btn btn-secondary" type="submit">Enregistrer</button>
            </div>
        </form>   
      
    </div>
{% endblock content %}
