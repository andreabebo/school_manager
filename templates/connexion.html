<Doctype!>
<html>
    <head>
        <meta charset="utf-8">
        <meta name= "viewport" content= "width=device-width, intial-scale=1.0">
        <link href="/static/css/styles.css" rel="stylesheet" />
        <link href="/static/css/fontawesome-free-6.6.0-desktop.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <title>Connexion</title>
        <style>
            .container .row .col{
                margin-top: 15px;
                
            }
            .form-control.sip{
                background-color: whitesmoke;
            }
            .andy form{
                border-radius: 20px;
                margin-top: 20px;
            }
        </style>    
    </head>
    <body class="bg-primary">
        <div class="container">
            <div class="andy d-flex justify-content-center h-100 align-items-center">
                

                <div class="w-50">
                    {% if messages %}
                        <div class="error-messages">
                        {% for message in messages  %}
                            <p class="error">{{ message }}</p>
                    {% endfor %}
                        </div>
                    {% endif %}
                
                    <form id="loginForm"  method="post" action="{% url 'connexion' %}" class="bg-white p-1">
                        {% csrf_token %}
                        <h1 class="text-center fw-bold">Connexion</h1>
                        <div class="row flex-column m-3">
                            <div class="col">
                                <label for="#username">Adresse email:</label>
                                <input class="form-control sip" type="text" name="username">
                            </div>
                            <div class="col">
                                <label for="#password">Mot de passe:</label>
                                <input class="form-control sip" type="password" name="password" required>
                            </div>
                            <div class="d-flex justify-content-center mt-4">
                                <button class="btn btn-primary w-50" type="submit">Connexion</button>
                            </div>
                        </div>
                        
                    </form>      
                    </div>
                </div>
            </div>
    </body>       
        
</html>
