{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="/static/css/fontawesome/css/all.css" referrerpolicy="no-referrer" />
    <link href="/static/css/styles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-light: #f8f9fa;
      --bg-dark: #343a40;
      --text-light: #212529;
      --text-dark: #f8f9fa;
      --card-light: #fff;
      --card-dark: #495057;
    }

    body.light-mode {
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    body.dark-mode {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    .login-box {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 8px;
      background-color: var(--card-light);
      color: inherit;
      width: 100%;
    }

    @media (max-width: 576px) {
      .login-box {
        padding: 15px;
        max-width: 100%;
      }
    }

    body.dark-mode .login-box {
      background-color: var(--card-dark);
    }

    .toggle-switch {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }
    body{
        background-image: url("{% static 'images/ecranConnexion.jpeg' %}");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
    }
  </style>
</head>
<body class="light-mode" >

  <!-- Bouton mode sombre / clair -->
  <div class="toggle-switch">
    <button class="btn btn-sm btn-secondary" onclick="toggleMode()">🌙 / ☀️</button>
  </div>

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
        <div class="login-box shadow">
          <h4 class="text-center mb-4">Connexion</h4>
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i>{{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
          <form id="loginForm" method="post" action="{% url 'connexion' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="email" class="form-label">Adresse e-mail</label>
              <input type="text" class="form-control" id="email" placeholder="Entrez nom d'utilisateur" name="username" required value="{{ username|default:'' }}" />
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="Mot de passe" name="password" required />
                <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" onclick="togglePassword()">
                  <i id="togglePasswordIcon" class="fa-solid fa-eye-slash"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Se connecter</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6DQD5NnQ64u9ZZg3QEO2B9j7l9v6p5a5F49z5q4v7B6+" crossorigin="anonymous"></script>
  <script>
    // Fix fermeture alert Bootstrap si JS natif ne fonctionne pas
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.alert .btn-close').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var alert = btn.closest('.alert');
          if(alert) alert.classList.remove('show');
          setTimeout(function(){ if(alert) alert.remove(); }, 300);
        });
      });
    });
  </script>

  <script>
    // Bascule entre les modes clair et sombre
    function toggleMode() {
      const body = document.body;
      body.classList.toggle("light-mode");
      body.classList.toggle("dark-mode");
    }

    // Afficher / masquer le mot de passe
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const icon = document.getElementById("togglePasswordIcon");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.classList.add("fa-eye");
        icon.classList.remove("fa-eye-slash");
      } else {
        passwordInput.type = "password";
        icon.classList.add("fa-eye-slash");
        icon.classList.remove("fa-eye");
      }
    }

    

      // Ici tu peux ajouter une vérification (ex : appel API, validation, etc.)

      // Simuler une connexion réussie
      
  </script>
</body>
</html>
