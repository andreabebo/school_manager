{% extends "base.html" %}
{% block title %}{% endblock title %}
{% block css %}
    <style>
        .andy form{
            Width: 500Px;
            height: 310px;
            border-radius: 20px;
            background: skyblue;
            padding: 20px;
            

        }
        .form-control shim{
            display: block;
            margin-left: 20px;
            width: 400px;
          
            
        }

    .lis{
        margin-top: 10px;
        font-weight: bold;
    }
   
    h1{
        text-align: center;
        font-weight: bold;
    }
    
    .row{
        margin-bottom: 60px;
    }
    .andy .row .col{
        margin-top: 10px;
        
    }
    .btn.btn-secondary{  
        width: 200px;
        border-radius: 8px;
        background: blue;
        color: white;
        margin-top: 15px;
    }
    </style>
{% endblock css %}
{% block content %}

        <h1>STATISTIQUES</h1>
    <div class="andy d-flex justify-content-center">
        <form class="nick" method="post" >
            {% csrf_token %}
            
                <div class="col">
                    <label class="lis"  for="">Date de la session:</label>
                    <input class="form-control shim" type="date" name="date_session">
                </div>
                <div class="col">
                    <label class="lis" for="">Nom de la session:</label>
                    <input class="form-control shim" type="month" name="nom_session">
                </div>
                <div class="col">
                    <label class="lis" for="">Nombre d'inscrits:</label>
                    <input class="form-control shim" type="number" name="inscrits">
                </div>
                <div class="d-flex justify-content-center">
                    <button class="btn btn-secondary">Creer</button>
                </div>
            
        </form>
    </div>    


{% endblock content %}
{% block js %}

{% endblock js %}
