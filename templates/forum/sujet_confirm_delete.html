{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow border-0">
        <div class="card-header bg-danger text-white text-center">
          <h3 class="mb-0"><i class="fa-solid fa-trash me-2"></i>Supprimer le sujet</h3>
        </div>
        <div class="card-body p-4">
          <p>Voulez-vous vraiment supprimer le sujet <strong>"{{ object.titre }}"</strong> ? Cette action est irréversible.</p>
          <form method="post">{% csrf_token %}
            <div class="d-flex justify-content-between">
              <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Annuler</a>
              <button type="submit" class="btn btn-danger">Supprimer définitivement</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
