{% extends "base.html" %}
{% block title %}Création d'une nouvelle session{% endblock title %}

{% block css %}
<style>
    body {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    
    .form-container {
        max-width: 500px;
        width: 100%;
        animation: fadeIn 0.6s ease-out;
    }
    
    .form-card {
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        transition: transform 0.3s ease;
    }
    
    .form-card:hover {
        transform: translateY(-5px);
    }
    
    .card-header {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        padding: 25px 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    
    .card-header::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
        transform: rotate(30deg);
    }
    
    .card-header h1 {
        font-weight: 700;
        letter-spacing: 1px;
        position: relative;
        margin: 0;
        font-size: 2.2rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    
    .card-body {
        padding: 40px;
    }
    
    .form-group {
        margin-bottom: 30px;
        position: relative;
    }
    
    label {
        display: block;
        margin-bottom: 12px;
        font-weight: 600;
        color: #1e3c72;
        font-size: 1.05rem;
    }
    
    .form-control {
        width: 100%;
        padding: 16px 20px;
        border: none;
        border-radius: 12px;
        background: #f0f5ff;
        transition: all 0.3s ease;
        font-size: 1.05rem;
        box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.05);
        color: #2a5298;
        font-weight: 500;
    }
    
    .form-control:focus {
        background: white;
        box-shadow: 0 0 0 3px rgba(74, 123, 255, 0.3), inset 3px 3px 6px rgba(0, 0, 0, 0.05);
        outline: none;
    }
    
    .input-icon {
        position: relative;
    }
    
    .input-icon i {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: #4a7bff;
        font-size: 1.2rem;
    }
    
    .submit-btn {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 16px 40px;
        font-size: 1.15rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: block;
        margin: 30px auto 0;
        width: 100%;
        max-width: 280px;
        box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3);
        position: relative;
        overflow: hidden;
        letter-spacing: 0.5px;
    }
    
    .submit-btn::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -60%;
        width: 20px;
        height: 200%;
        background: rgba(255, 255, 255, 0.3);
        transform: rotate(30deg);
        transition: all 0.6s;
    }
    
    .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(30, 60, 114, 0.4);
    }
    
    .submit-btn:hover::after {
        left: 120%;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 576px) {
        .card-body {
            padding: 30px 20px;
        }
        
        .card-header h1 {
            font-size: 1.8rem;
        }
    }
</style>
{% endblock css %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="card-header">
            <h1>NOUVELLE SESSION</h1>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="nom_session">Nom de la session</label>
                    <div class="input-icon">
                        <input type="text" class="form-control" id="nom_session" name="nom_session" placeholder="Entrez le nom de la session">
                        <i class="bi bi-calendar-event"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="date_session">Date de la session</label>
                    <div class="input-icon">
                        <input type="date" class="form-control" id="date_session" name="date_session">
                        <i class="bi bi-calendar-date"></i>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">
                    <i class="bi bi-check-circle me-2"></i> Créer la session
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
