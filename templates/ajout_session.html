{% extends "base.html" %}
{% block title %}{% endblock title %}
{% block css %}
    <style>
        .andy form{
            Width: 400Px;
            height: 245px;
            border-radius: 20px;
            background: skyblue;
            margin-top: 30px;
            padding: 20px;
            box-shadow: 10px 5px 5px gray;

        }
        .container .row .col{
            margin-top: 10px;
        }

        .lis{
            margin-top: 10px;
            font-weight: bold;
        }
        .btn.btn-secondary{
            Width: 200Px;
            margin-top: 30px;
        
        }
        h1{
            text-align: center;
            font-weight: bold;
        }
    </style>
{% endblock css %}
{% block content %}
        <h1>NOUVELLE SESSION</h1>
        <div class="container">
            <div class="andy d-flex justify-content-center">
            <form class="nick" method="post" >
            {% csrf_token %}
            <div class="col">
            <label class="lis"  for="">Nom de la session:</label>
            <input class="form-control sim" type="text" name="nom_session">
            </div>
            <div class="col">
            <label class="lis" for="">Date:</label>
            <input class="form-control sim" type="date" name="date_session">
            </div>
            <div class="d-flex justify-content-center">
            <button class="btn btn-secondary">Soumettre</button>
            </div>
            </form>
        </div>  
    </div>  
{% endblock content %}
